; 翻面: 之前本段缺失, 三个数值会读成 0(V/Hz/s), 下发后下位机不动
; 表现为"翻面点了没反应"
[MotionFlip]
voltage=16
frequency=36
timeuse=1.5

[BinMotion]
voltage=10
frequency=100
timeuse=0

[LightA]
brightness=50
timeuse=5

[LightB]
brightness=50
timeuse=5


; 应用设置
[app]
autoConnect=true
version=1.2
description=Serial Debug Tool
recentFiles=file1.txt,file2.txt,file3.txt

[GatherSequence]
hmotion_time=0.8
vmotion_time=0.8
interval_time=0.1

[ModifyCoeff]
; 位置修正系数(-50~50), 只有水平居中/垂直居中会下发, 其他运动发 0
; hcentered = 水平居中 -> 界面上 vsHModify 竖直滑块
; vcentered = 垂直居中 -> 界面上 hsVModify 水平滑块
hcentered=0
vcentered=0

